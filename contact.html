<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form Layout</title>
    <link rel="stylesheet" href="contact.css">
</head>
<body>
 <nav>
    <div class="left">CONTACT US</div>
    <div class="right">
      <ul><a href="index.html" class="home">Home </a>
        <a href="about.html" class="home"> About </a>
        <a href="projects.html" class="home"> Projects</a>
        <a href="contact.html" class="home">Contact us</a>
      </ul>
    </div>
  </nav>
    <!-- Contact Section -->
    <section class="contact-section" id="contact">
        <div class="container">
            
            <!-- Left Side: Contact Information -->
            <div class="contact-info-wrapper">
                <span class="sub-heading">CONTACT ME</span>
                <h2 class="main-heading">Get In <span class="highlight">Touch</span></h2>
                
                <div class="info-list">
                    <!-- Email -->
                    <div class="info-item">
                        <div class="icon">
                            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                            </svg>
                        </div>
                        <div class="details">
                            <h4>Email</h4>
                            <p>cs5375112@gmail.com</p>
                        </div>
                    </div>
                    
                    <!-- Phone -->
                    <div class="info-item">
                        <div class="icon">
                            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
                            </svg>
                        </div>
                        <div class="details">
                            <h4>Phone</h4>
                            <p>+91 16307130186</p>
                        </div>
                    </div>
                    
                    <!-- Location -->
                    <div class="info-item">
                        <div class="icon">
                            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            </svg>
                        </div>
                        <div class="details">
                            <h4>Location</h4>
                            <p>Gorakhpur, Uttar Pradesh, India</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Side: Contact Form -->
            <div class="contact-form-wrapper">
                <form action="#" method="POST">
                    <div class="input-row">
                        <input type="text" placeholder="Your Name" required>
                        <input type="email" placeholder="Your Email" required>
                    </div>
                    <input type="text" placeholder="Subject" required>
                    <textarea placeholder="Your Message" rows="6" required></textarea>
                    <button type="submit" class="submit-btn">Send Message</button>
                </form>
            </div>

        </div>
    </section>

    <!-- Footer Area -->
    <footer class="site-footer">
        <div class="footer-container">
            <div class="logo">
                Chandu<span class="dot">.</span>
            </div>
            <div class="copyright">
                &copy; 2024 Chandreshwar Sharma. All Rights Reserved.
            </div>
            <a href="#contact" class="back-to-top">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 10l7-7m0 0l7 7m-7-7v18"></path>
                </svg>
            </a>
        </div>
    </footer>

</body>
</html>
